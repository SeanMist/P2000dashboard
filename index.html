<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Live Meldingen - Groningen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d9534f;
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .loading {
            font-style: italic;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>P2000 Live Meldingen Groningen</h1>
        <p>Live overzicht van alarmeringen. Nieuwe meldingen verschijnen direct automatisch bovenaan.</p>
        
        <div id="loading" class="loading">Meldingen laden...</div>
        
        <table id="meldingenTable" style="display:none;">
            <thead>
                <tr>
                    <th>Tijd</th>
                    <th>Plaats / Regio</th>
                    <th>Melding</th>
                </tr>
            </thead>
            <tbody id="meldingenBody">
                <!-- Meldingen komen hier -->
            </tbody>
        </table>
    </div>

    <script>
        async function laadMeldingen() {
            try {
                const response = await fetch('/api/meldingen');
                const data = await response.json();
                
                const tbody = document.getElementById('meldingenBody');
                let meldingen = Array.isArray(data) ? data : (data.messages || data.data || []);

                if (meldingen.length === 0) {
                    return;
                }

                // Sorteer direct zodat de nieuwste melding bovenaan staat
                meldingen.sort((a, b) => {
                    return new Date(b.time || 0) - new Date(a.time || 0);
                });

                tbody.innerHTML = '';

                meldingen.forEach(m => {
                    const tr = document.createElement('tr');
                    
                    const tijd = m.time || 'Net binnen';
                    const plaats = m.city || 'Groningen';
                    const tekst = m.text || 'Geen omschrijving';

                    tr.innerHTML = `
                        <td><strong>${tijd}</strong></td>
                        <td>${plaats}</td>
                        <td>${tekst}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('meldingenTable').style.display = 'table';
            } catch (error) {
                console.error('Fout bij ophalen');
            }
        }

        // Direct laden en elke 10 seconden automatisch verversen
        laadMeldingen();
        setInterval(laadMeldingen, 10000);
    </script>
</body>
</html>
