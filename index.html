<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Groningen - Bank Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome iconen -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-6 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-4">
            <div class="bg-red-600 text-white p-3.5 rounded-2xl shadow-lg shadow-red-600/30">
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-white flex items-center gap-3 tracking-wide">
                    P2000 GRONINGEN - LIVE
                    <span class="inline-block w-3.5 h-3.5 rounded-full bg-emerald-500 animate-ping"></span>
                </h1>
                <p class="text-sm text-slate-400">Meest recente 3 meldingen (Real-time monitor)</p>
            </div>
        </div>
        <div id="status-tijd" class="text-sm font-mono bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 text-slate-300">
            Bezig met laden...
        </div>
    </header>

    <!-- Meldingen Groot voor op de bank -->
    <main class="max-w-7xl w-full mx-auto p-6 flex-grow flex flex-col justify-center">
        <div id="meldingen" class="space-y-6">
            <div class="text-center py-20 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-5xl mb-4 text-red-500"></i>
                <p class="text-lg">Live meldingen ophalen...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-sm text-slate-500">
        Ververst automatisch elke 15 seconden • Geoptimaliseerd om vanaf afstand te lezen
    </footer>

    <!-- JavaScript -->
    <script>
        async function laadLiveData() {
            try {
                // We gebruiken een rechtstreekse feed die gekoppeld is aan de actieve alarmeringen-stroom
                const feedUrl = 'https://www.alarmeringen.nl/groep/brandweer/groningen/rss/';
                const url = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feedUrl);
                const response = await fetch(url);
                const data = await response.json();

                let items = [];
                if (data.status === 'ok' && data.items.length > 0) {
                    items = data.items;
                } else {
                    // Fallback naar de algemene Groningen feed als de brandweer-feed even afwijkt
                    const backupUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('http://feeds.feedburner.com/p2000-regio-groningen');
                    const res2 = await fetch(backupUrl);
                    const data2 = await res2.json();
                    items = data2.items || [];
                }

                if (items.length > 0) {
                    const container = document.getElementById('meldingen');
                    container.innerHTML = '';

                    // Pak alleen de eerste 3 (allerrecentste) meldingen
                    const recenteItems = items.slice(0, 3);

                    recenteItems.forEach(item => {
                        let tijd = 'Zojuist';
                        try {
                            const d = new Date(item.pubDate);
                            tijd = d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        } catch(e){}

                        let tekst = item.title + ' ' + (item.description || '');
                        tekst = tekst.replace(/<[^>]*>?/gm, '');

                        let badge = '<span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-sm font-bold px-3 py-1 rounded-lg">P2000</span>';
                        let icoon = 'fa-truck-medical text-amber-400';
                        let borderKleur = 'border-slate-800 hover:border-slate-700';
                        
                        const l = tekst.toLowerCase();
                        if (l.includes('brandweer') || l.includes('prio 1') || l.includes('brand') || l.includes('dier')) {
                            badge = '<span class="bg-red-500/20 text-red-300 border border-red-500/30 text-sm font-bold px-3 py-1 rounded-lg">BRANDWEER</span>';
                            icoon = 'fa-fire-flame-curved text-red-500';
                            borderKleur = 'border-red-500/40 bg-red-950/10';
                        } else if (l.includes('ambulance') || l.includes('a1') || l.includes('a2')) {
                            badge = '<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-sm font-bold px-3 py-1 rounded-lg">AMBULANCE</span>';
                            icoon = 'fa-truck-medical text-emerald-400';
                            borderKleur = 'border-emerald-500/40 bg-emerald-950/10';
                        } else if (l.includes('politie')) {
                            badge = '<span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-sm font-bold px-3 py-1 rounded-lg">POLITIE</span>';
                            icoon = 'fa-shield-halved text-blue-400';
                            borderKleur = 'border-blue-500/40 bg-blue-950/10';
                        }

                        // Grote weergave voor vanaf de bank
                        container.innerHTML += `
                            <div class="bg-slate-900 border-2 ${borderKleur} p-6 rounded-3xl flex items-start gap-5 shadow-2xl transition-all">
                                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 shrink-0 text-2xl">
                                    <i class="fa-solid ${icoon}"></i>
                                </div>
                                <div class="flex-grow">
                                    <div class="flex items-center justify-between mb-2">
                                        ${badge}
                                        <span class="text-sm font-mono text-slate-400 bg-slate-950 px-3 py-1 rounded-lg border border-slate-800">
                                            <i class="fa-regular fa-clock mr-1.5"></i>${tijd}
                                        </span>
                                    </div>
                                    <p class="text-xl sm:text-2xl text-slate-100 font-mono leading-relaxed mt-2">${tekst}</p>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('status-tijd').innerHTML = `<i class="fa-solid fa-circle text-emerald-400 text-xs mr-2"></i>Laatste update: ${new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}` ;
                }
            } catch (error) {
                console.error('Fout bij laden:', error);
            }
        }

        // Direct laden bij openen
        laadLiveData();

        // Automatisch verversen elke 15 seconden
        setInterval(laadLiveData, 15000);
    </script>
</body>
</html>
