<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2000 Live Meldingen - Groningen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d9534f;
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .loading {
            font-style: italic;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>P2000 Live Meldingen Groningen</h1>
        <p>Live overzicht van de laatste alarmeringen. Ververst automatisch.</p>
        
        <div id="loading" class="loading">Meldingen ophalen...</div>
        
        <table id="meldingenTable" style="display:none;">
            <thead>
                <tr>
                    <th>Tijd</th>
                    <th>Plaats / Regio</th>
                    <th>Melding</th>
                </tr>
            </thead>
            <tbody id="meldingenBody">
                <!-- Meldingen komen hier -->
            </tbody>
        </table>
    </div>

    <script>
        async function laadMeldingen() {
            try {
                const response = await fetch('/api/meldingen');
                const data = await response.json();
                
                const tbody = document.getElementById('meldingenBody');
                tbody.innerHTML = '';
                
                // Flexibele check om de array met meldingen uit de API te halen
                let meldingen = [];
                if (Array.isArray(data)) {
                    meldingen = data;
                } else if (data.messages) {
                    meldingen = data.messages;
                } else if (data.data) {
                    meldingen = data.data;
                } else if (data.results) {
                    meldingen = data.results;
                }

                if (meldingen.length === 0) {
                    document.getElementById('loading').innerText = 'Geen actuele meldingen gevonden op dit moment.';
                    return;
                }

                meldingen.forEach(m => {
                    const tr = document.createElement('tr');
                    
                    // Vangen van verschillende mogelijke veldnamen uit de API
                    const tijd = m.time || m.timestamp || m.date || 'Net binnen';
                    const plaats = m.city || m.region || m.location || 'Groningen';
                    const tekst = m.text || m.message || m.gordel || JSON.stringify(m);

                    tr.innerHTML = `
                        <td>${tijd}</td>
                        <td>${plaats}</td>
                        <td>${tekst}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('meldingenTable').style.display = 'table';
            } catch (error) {
                document.getElementById('loading').innerText = 'Fout bij het ophalen van de live data.';
            }
        }

        // Direct laden bij openen en daarna elke 15 seconden automatisch vernieuwen voor nieuwe meldingen
        laadMeldingen();
        setInterval(laadMeldingen, 15000);
    </script>
</body>
</html>
